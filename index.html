<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Clean and modern Todo application built with HTML, CSS, and JavaScript." />
  <title>TodoFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="todo-app" aria-label="Todo application">
      <header class="app-header">
        <div>
          <p class="eyebrow">Productive Day</p>
          <h1>TodoFlow</h1>
          <p class="subtitle">Organize work, stay focused, and finish faster.</p>
        </div>
        <div class="task-count-card" aria-live="polite">
          <span id="activeCount">0</span>
          <small>tasks left</small>
        </div>
      </header>

      <form id="todoForm" class="todo-form" autocomplete="off">
        <label for="todoInput" class="sr-only">Add a task</label>
        <input id="todoInput" type="text" maxlength="120" placeholder="What needs to be done today?" required />
        <button type="submit">Add Task</button>
      </form>

      <section class="toolbar" aria-label="Task controls">
        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button class="filter-btn active" type="button" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="filter-btn" type="button" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button class="filter-btn" type="button" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>
        <button id="clearCompleted" class="clear-btn" type="button">Clear completed</button>
      </section>

      <ul id="todoList" class="todo-list" aria-live="polite"></ul>
      <p id="emptyState" class="empty-state">No tasks yet. Add your first task above.</p>

      <section class="api-panel" aria-label="AWS API Gateway integration">
        <h2>AWS API Gateway</h2>
        <p class="api-note">Connect and test your GET and POST endpoints directly from this app.</p>

        <div class="api-grid">
          <div class="api-card">
            <label for="apiGetUrl">GET endpoint</label>
            <input
              id="apiGetUrl"
              type="url"
              value="https://fftmn8zyq6.execute-api.us-east-1.amazonaws.com/prod/hello"
              placeholder="https://example.execute-api.region.amazonaws.com/prod/hello"
            />
            <button id="apiGetButton" type="button">Call GET</button>
          </div>

          <div class="api-card">
            <label for="apiPostUrl">POST endpoint</label>
            <input
              id="apiPostUrl"
              type="url"
              placeholder="https://example.execute-api.region.amazonaws.com/prod/your-post-route"
            />
            <label for="apiPostBody">POST body (JSON)</label>
            <textarea id="apiPostBody" rows="4" placeholder='{"message":"Hello from TodoFlow"}'></textarea>
            <button id="apiPostButton" type="button">Call POST</button>
          </div>
        </div>

        <p id="apiStatus" class="api-status" aria-live="polite"></p>
        <pre id="apiResponse" class="api-response">Response will appear here.</pre>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
